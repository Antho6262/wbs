<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>W.B.S — Initialisation</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">
<div class="login-wrap">
  <div class="login-card" style="max-width:440px;">
    <img src="img/logo.png" alt="W.B.S" class="login-logo">
    <h1>INITIALISATION</h1>
    <div class="login-sub">PREMIÈRE INSTALLATION</div>
    <p style="font-size:14px;color:var(--muted);margin-top:-10px;">
      Crée le compte Fondateur (caché du site) et charge les 15 membres. Cette page ne doit servir qu'une fois.
    </p>
    <form id="form-setup">
      <div class="field">
        <label>Ton pseudo</label>
        <input type="text" id="s-pseudo" placeholder="Pseudo fondateur" required>
      </div>
      <div class="field">
        <label>Mot de passe</label>
        <input type="password" id="s-pass" placeholder="Choisis un mot de passe" required>
      </div>
      <button class="submit" type="submit" style="margin-top:6px;">Initialiser le site</button>
    </form>
    <div class="login-error" id="s-error"></div>
    <div class="login-links"><a href="index.html">Retour à la connexion</a></div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
<script src="js/firebase-config.js"></script>
<script>
  document.getElementById('form-setup').addEventListener('submit', async (e) => {
    e.preventDefault();
    const errEl = document.getElementById('s-error');
    errEl.textContent = '';
    const pseudo = document.getElementById('s-pseudo').value.trim();
    const pass = document.getElementById('s-pass').value;

    try {
      const existing = await db.ref('membres').get();
      if (existing.exists() && Object.keys(existing.val()).length > 0) {
        if (!confirm("La base contient déjà des données. Tout supprimer et réinitialiser le site ?")) return;
      }
      await db.ref().set(null); // vide entièrement la base avant l'initialisation

      const id = uid();
      // Compte Fondateur : admin, invisible partout (classements, stats, tracker) et caché dans Admin
      await db.ref('membres/' + id).set({
        prenom: pseudo,
        mot_de_passe: pass,
        grade: 'fondateur',
        role: 'admin',
        actif: true,
        invisible: true,
        cache: true
      });

      // Membres de la PF (mot de passe par défaut : wbs123 — à changer dans Profil)
      const MEMBRES = [
        ['Iyo Mamet', 'chef'], ['Thaylis Doerty', 'colead'], ['Mehdi Kefifi', 'brasdroit'],
        ['Dominic Kefifi', 'ga'], ['Julio Kefifi', 'soldatchef'], ['Maleko Merah', 'soldat2'],
        ['Abdel Bouadj', 'soldat'], ['Donnie Brasco', 'soldat'], ['Evan Bailey', 'soldat'], ['Julio Santos', 'soldat'],
        ['Achille Pirelli', 'recru'], ['Hadil Lee', 'recru'], ['Isaiah Adama', 'recru'],
        ['Paolo Bellini', 'recru'], ['Walid Krack', 'recru']
      ];
      for (const [prenom, grade] of MEMBRES) {
        await db.ref('membres/' + uid()).set({ prenom, mot_de_passe: 'wbs123', grade, role: 'membre', actif: true });
      }
      await db.ref('config').set({
        nom_groupe: 'W.B.S',
        taux_action_pct: 25,
        taux_cambriolage: 700,
        taux_pochon: 25,
        taux_branche: 10,
        blanchiment_taux: 20
      });

      setSession({ id, prenom: pseudo, grade: 'fondateur', role: 'admin' });
      window.location.href = 'pages/dashboard.html';
    } catch (err) {
      errEl.textContent = "Erreur d'initialisation — vérifie ta config Firebase et les règles de la base.";
      console.error(err);
    }
  });
</script>
</body>
</html>
